---
app-template:
  controllers:
    main:
      strategy: RollingUpdate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      pod:
        # These hostnames only exist in local DNS, which cluster DNS can't resolve.
        # Point them at Traefik so MCPHub can reach the OAuth-protected endpoints.
        hostAliases:
          - ip: 192.168.10.200
            hostnames:
              - wardrowbe-mcp.mdeleon.dev
              - trek.mdeleon.dev
      containers:
        main:
          nameOverride: mcphub
          image:
            repository: samanhappy/mcphub
            tag: "1.2.4"
          env:
            DB_URL:
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: DB_URL
            INSTALL_BASE_URL: https://mcphub.mdeleon.dev
            NODE_ENV: production
            JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: JWT_SECRET
            ADMIN_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: ADMIN_PASSWORD
            BETTER_AUTH_ENABLED: true
            BETTER_AUTH_SECRET:
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: BETTER_AUTH_SECRET
            BETTER_AUTH_URL: https://mcphub.mdeleon.dev
            BETTER_AUTH_OIDC_ENABLED: true
            BETTER_AUTH_OIDC_PROVIDER_ID: pocketid
            BETTER_AUTH_OIDC_DISCOVERY_URL: https://pocket.mdeleon.dev/.well-known/openid-configuration
            OIDC_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: OIDC_CLIENT_ID
            OIDC_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: OIDC_CLIENT_SECRET
            BETTER_AUTH_GOOGLE_ENABLED: false
            BETTER_AUTH_GITHUB_ENABLED: false
    postgres:
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        postgres:
          nameOverride: postgres
          image:
            repository: pgvector/pgvector
            tag: "pg18-trixie"
          env:
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: mcphub-secrets
                  key: POSTGRES_PASSWORD
            POSTGRES_USER: mcphub
            PGDATA: /var/lib/postgresql/data/pg_data
            POSTGRES_DB: mcphub

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
    postgres:
      controller: postgres
      ports:
        http:
          port: 5432

  persistence:
    pg-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        postgres:
          postgres:
            - path: /var/lib/postgresql/data
  ingress:
    mcphub:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: MCP Hub
        gethomepage.dev/description: MCP gateway
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: AI
        gethomepage.dev/icon: sh-mcphub.png
        gethomepage.dev/pod-selector: ""
      hosts:
        - host: mcphub.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: mcphub-tls-cert
          hosts:
            - mcphub.mdeleon.dev
