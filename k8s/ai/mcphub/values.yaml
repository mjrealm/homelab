---
app-template:
  controllers:
    main:
      strategy: RollingUpdate
      pod:
        # These hostnames only exist in local DNS, which cluster DNS can't resolve.
        # Point them at Traefik so MCPHub can reach the OAuth-protected endpoints.
        hostAliases:
          - ip: 192.168.10.200
            hostnames:
              - wardrowbe-mcp.mdeleon.dev
              - trek.mdeleon.dev
      containers:
        main:
          nameOverride: mcphub
          image:
            repository: samanhappy/mcphub
            tag: "1.2.4"
    postgres:
      containers:
        postgres:
          nameOverride: postgres
          image:
            repository: pgvector/pgvector
            tag: "pg18-trixie"

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
    postgres:
      controller: postgres
      ports:
        http:
          port: 5432

  persistence:
    pg-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        postgres:
          postgres:
            - path: /var/lib/postgresql/data
