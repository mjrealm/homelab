---
app-template:
  controllers:
    main:
      strategy: RollingUpdate
      containers:
        main:
          nameOverride: mcphub
          image:
            repository: samanhappy/mcphub
            tag: "1.0.33"
    postgres:
      containers:
        postgres:
          nameOverride: postgres
          image:
            repository: pgvector/pgvector
            tag: "pg18-trixie"

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
    postgres:
      controller: postgres
      ports:
        http:
          port: 5432

  persistence:
    pg-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        postgres:
          postgres:
            - path: /var/lib/postgresql/data
