apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: mcphub
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: e884d4d2-4998-4abe-b7fa-813b2b410f69
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-ai
        namespace: infisical-operator
      secretsScope:
        projectSlug: ai
        envSlug: prod
        secretsPath: /mcphub
        recursive: false
  managedKubeSecretReferences:
    - secretName: mcphub-secrets
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          DB_URL: "postgresql://mcphub:{{ `{{ .POSTGRES_PASSWORD.Value | urlquery }}` }}@mcphub-postgres:5432/mcphub"
