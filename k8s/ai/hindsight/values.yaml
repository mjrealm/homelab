---
hindsight:
  # API keys and model names come from the Infisical `hindsight` folder (envFrom).
  existingSecret: hindsight-secrets
  # Kubernetes expands $(POSTGRES_PASSWORD) from existingSecret.
  databaseUrl: postgresql://hindsight:$(POSTGRES_PASSWORD)@hindsight-postgresql:5432/hindsight
  api:
    image:
      # Slim image: no local models, embeddings and reranking come from LiteLLM
      tag: "1.0.0-slim"
    env:
      HINDSIGHT_API_LLM_PROVIDER: openai
      # Unset the chart default so the model name comes from hindsight-secrets (envFrom).
      HINDSIGHT_API_LLM_MODEL: null
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_RERANKER_PROVIDER: cohere
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://litellm.litellm.svc:4000/v1
      HINDSIGHT_API_LLM_BASE_URL: http://litellm.litellm.svc:4000/v1
  controlPlane:
    image:
      tag: "1.0.0"
  postgresql:
    image:
      repository: pgvector/pgvector
      tag: "pg18-trixie"
    persistence:
      enabled: true
      size: 8Gi
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Hindsight
      gethomepage.dev/description: AI agent memory
      gethomepage.dev/group: AI
      gethomepage.dev/icon: hindsight.png
      gethomepage.dev/pod-selector: ""
    hosts:
      - host: &hindsight hindsight.mdeleon.dev
        paths:
          - path: /
            pathType: Prefix
            service: controlPlane
    tls:
      - secretName: hindsight-tls-cert
        hosts:
          - *hindsight
