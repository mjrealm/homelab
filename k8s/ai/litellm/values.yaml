---
litellm-helm:
  # Secrets come from the Infisical `litellm` folder.
  masterkeySecretName: litellm-secrets
  masterkeySecretKey: PROXY_MASTER_KEY
  environmentSecrets:
    - litellm-secrets
  deploymentAnnotations:
    secrets.infisical.com/auto-reload: "true"
  image:
    tag: "1.108.3"
    pullPolicy: IfNotPresent

  # Postgres is provided by the CNPG cluster in templates/postgres.yaml.
  db:
    deployStandalone: false
    useExisting: true
    endpoint: litellm-database-rw
    database: litellm
    secret:
      name: litellm-database-app
      usernameKey: username
      passwordKey: password
  postgresql:
    enabled: false
  redis:
    enabled: false

  # The chart's migration Job is an Argo CD PreSync hook, which runs before the
  # CNPG cluster exists. The proxy migrates the schema itself on startup.
  migrationJob:
    enabled: false

  # Models are added from the admin UI and stored (encrypted) in Postgres.
  proxy_config:
    model_list: []
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      # Don't allow UI login with UI_USERNAME/UI_PASSWORD or the master key.
      # Admins sign in with their own account (or SSO) instead.
      disable_env_credential_login: true

  envVars:
    PROXY_BASE_URL: https://litellm.mdeleon.dev
    # Send visitors of / to the admin UI instead of the Swagger docs.
    DOCS_URL: "/docs"
    ROOT_REDIRECT_URL: "/ui"
    # Pocket ID SSO. GENERIC_CLIENT_ID and GENERIC_CLIENT_SECRET come from litellm-secrets.
    GENERIC_AUTHORIZATION_ENDPOINT: https://pocket.mdeleon.dev/authorize
    GENERIC_TOKEN_ENDPOINT: https://pocket.mdeleon.dev/api/oidc/token
    GENERIC_USERINFO_ENDPOINT: https://pocket.mdeleon.dev/api/oidc/userinfo
    GENERIC_SCOPE: openid profile email
    GENERIC_USER_ID_ATTRIBUTE: preferred_username
    GENERIC_USER_EMAIL_ATTRIBUTE: email
    GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
    AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
    STORE_MODEL_IN_DB: "true"

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/name: LiteLLM
      gethomepage.dev/description: LLM Gateway
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: AI
      gethomepage.dev/icon: sh-litellm.png
    hosts:
      - host: &litellm litellm.mdeleon.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: litellm-tls-cert
        hosts:
          - *litellm

# Database backups to Cloudflare R2 (CloudNativePG Barman plugin). The access key and
# secret are in Infisical, in this app's folder: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
backup:
  r2:
    bucket: homelab-db-backups
    endpointURL: https://683d43af18913fe58dc1c66b52e4a027.r2.cloudflarestorage.com
    retention: 3d
    schedule: "0 0 2 * * 0"  # UTC, Sundays, outside the Velero window. Run: make check-backups
