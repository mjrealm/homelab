---
app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 10000
      fsGroupChangePolicy: OnRootMismatch
  controllers:
    main:
      strategy: RollingUpdate
      rollingUpdate:
        unavailable: 1
        surge: 1
      containers:
        main:
          nameOverride: hermes
          image:
            repository: nousresearch/hermes-agent
            tag: "stable"
          env:
            HINDSIGHT_BANK_ID_TEMPLATE: "hermes-{profile}"

  service:
    main:
      controller: main
      ports:
        http:
          port: 8642
        dashboard:
          port: 9119
        mcp:
          port: 8080

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 50Gi
      globalMounts:
        - path: /opt/data
