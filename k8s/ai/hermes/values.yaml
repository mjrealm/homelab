---
app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 10000
      fsGroupChangePolicy: OnRootMismatch
  controllers:
    mj:
      strategy: RollingUpdate
      rollingUpdate:
        unavailable: 1
        surge: 1
      containers:
        mj:
          nameOverride: mj
          image:
            repository: nousresearch/hermes-agent
            tag: "stable"

  service:
    mj:
      controller: mj
      ports:
        http:
          port: 8642
        dashboard:
          port: 9119
        mcp:
          port: 8080


  persistence:
    mj:
      enabled: true
      # Keep the claim name from when hermes had two instances (hermes-mj); with a
      # single one app-template would otherwise name it "hermes" and orphan the data.
      forceRename: hermes-mj
      type: persistentVolumeClaim
      # The volume was restored from a Longhorn backup through this StorageClass
      # (templates/storageclass.yaml); a PVC's storageClassName is immutable.
      storageClass: longhorn-restore-hermes-mj
      accessMode: ReadWriteOnce
      size: 100Gi
      advancedMounts:
        mj:
          mj:
            - path: /opt/data
