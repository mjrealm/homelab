---
phoenix-helm:
  # Postgres is provided by the CNPG cluster in templates/postgres.yaml.
  postgresql:
    enabled: false
  persistence:
    enabled: false
  database:
    postgres:
      host: phoenix-database-rw
      port: 5432
      db: phoenix
      user: app

  image:
    tag: version-20.26.0-nonroot

  service:
    type: ClusterIP

  securityContext:
    pod:
      enabled: true
    container:
      enabled: true

  server:
    rootUrl: https://phoenix.mdeleon.dev
    telemetryEnabled: false

  auth:
    useSecureCookies: true
    oauth2:
      enabled: true
      providers:
        pocket_id:
          display_name: Pocket ID
          oidc_config_url: https://pocket.mdeleon.dev/.well-known/openid-configuration
    createSecret: false
    secret:
      - key: PHOENIX_SECRET
        valueFrom:
          secretKeyRef:
            name: phoenix-secrets
            key: PHOENIX_SECRET
      - key: PHOENIX_ADMIN_SECRET
        valueFrom:
          secretKeyRef:
            name: phoenix-secrets
            key: PHOENIX_ADMIN_SECRET
      - key: PHOENIX_POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: phoenix-database-app
            key: password
      - key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: phoenix-secrets
            key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD

  ingress:
    enabled: true
    className: traefik
    host: &phoenix phoenix.mdeleon.dev
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/name: Phoenix
      gethomepage.dev/description: AI Observability
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: AI
      gethomepage.dev/icon: https://github.com/Arize-ai.png
      gethomepage.dev/pod-selector: app=phoenix
    tls:
      enabled: true
      certSource: secret
      secret:
        secretName: phoenix-tls-cert

  # The OAuth client ID is a ConfigMap value in the chart, so both come in as env vars.
  additionalEnv:
    - name: PHOENIX_OAUTH2_POCKET_ID_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: phoenix-secrets
          key: PHOENIX_OAUTH2_POCKET_ID_CLIENT_ID
    - name: PHOENIX_OAUTH2_POCKET_ID_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: phoenix-secrets
          key: PHOENIX_OAUTH2_POCKET_ID_CLIENT_SECRET
