---
app-template:
  controllers:
    tinyauth:
      replicas: 1
      strategy: RollingUpdate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        tinyauth:
          image:
            repository: ghcr.io/steveiliop56/tinyauth
            tag: v5.0.7
          env:
            TINYAUTH_APPURL: "https://tinyauth.mdeleon.dev"
            TINYAUTH_OAUTH_AUTOREDIRECT: pocketid
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID:
              valueFrom:
                secretKeyRef:
                  name: tinyauth-secrets
                  key: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET:
              valueFrom:
                secretKeyRef:
                  name: tinyauth-secrets
                  key: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://pocket.mdeleon.dev/authorize
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://pocket.mdeleon.dev/api/oidc/token
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://pocket.mdeleon.dev/api/oidc/userinfo
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: https://tinyauth.mdeleon.dev/api/oauth/callback/pocketid
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
            TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket ID
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

  service:
    tinyauth:
      controller: tinyauth
      ports:
        http:
          port: 3000

  ingress:
    tinyauth:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "TinyAuth"
        gethomepage.dev/description: "Forward Authentication Proxy"
        gethomepage.dev/group: "System"
        gethomepage.dev/icon: "sh-tinyauth.png"
        gethomepage.dev/pod-selector: "app.kubernetes.io/name=tinyauth"
      hosts:
        - host: &host tinyauth.mdeleon.dev
          paths:
            - path: /
              service:
                identifier: tinyauth
                port: http
      tls:
        - secretName: tinyauth-tls-cert
          hosts:
            - *host
