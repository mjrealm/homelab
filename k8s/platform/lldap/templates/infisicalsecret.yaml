apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: lldap
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: e2ccd552-d832-493d-8ca4-205f4e8c3f08
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-platform
        namespace: infisical-operator
      secretsScope:
        projectSlug: platform
        envSlug: prod
        secretsPath: /lldap
        recursive: false
  managedKubeSecretReferences:
    - secretName: lldap-secrets
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          LLDAP_DATABASE_URL: "postgres://admin:{{ `{{ .POSTGRES_PASSWORD.Value | urlquery }}` }}@lldap-postgres:5432/lldap"
