---
app-template:
  controllers:
    pocket-id:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        pocket-id:
          nameOverride: pocket-id
          image:
            repository: ghcr.io/pocket-id/pocket-id
            tag: v2.19.3
          env:
            APP_URL: https://pocket.mdeleon.dev
            TRUST_PROXY: "true"
            MAXMIND_LICENSE_KEY:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: MAXMIND_LICENSE_KEY
            PUID: "1000"
            PGID: "1000"
            DB_PROVIDER: postgres
            DB_CONNECTION_STRING:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: DB_CONNECTION_STRING
            ENCRYPTION_KEY:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: ENCRYPTION_KEY
            UI_CONFIG_DISABLED: "true"
            ALLOW_USER_SIGNUPS: disabled
            SMTP_HOST: smtp.gmail.com
            SMTP_PORT: "587"
            SMTP_FROM:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: SMTP_FROM
            SMTP_USER:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: SMTP_USER
            SMTP_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: SMTP_PASSWORD
            SMTP_TLS: starttls
            EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "true"
    postgres:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        postgres:
          nameOverride: postgres
          image:
            repository: postgres
            tag: "16.15"
          env:
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: POSTGRES_PASSWORD
            POSTGRES_USER: postgres
            POSTGRES_DB: pocketid
            PGDATA: /var/lib/postgresql/data/pg_data

  service:
    pocket-id:
      controller: pocket-id
      ports:
        http:
          port: 1411
    postgres:
      controller: postgres
      ports:
        http:
          port: 5432

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        pocket-id:
          pocket-id:
            - path: /app/data
    pg-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        postgres:
          postgres:
            - path: /var/lib/postgresql/data
  ingress:
    pocket-id:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Pocket ID
        gethomepage.dev/description: OIDC provider
        gethomepage.dev/group: System
        gethomepage.dev/icon: sh-pocket-id.png
      hosts:
        - host: pocket.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: pocket-id
                port: http
      tls:
        - secretName: pocket-id-tls-cert
          hosts:
            - pocket.mdeleon.dev
