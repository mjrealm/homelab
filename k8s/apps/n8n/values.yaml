---
app-template:
  controllers:
    n8n:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
      containers:
        n8n:
          nameOverride: n8n
          image:
            repository: docker.n8n.io/n8nio/n8n
            tag: "3.3.0"
          env:
            TZ: "America/Los_Angeles"
            GENERIC_TIMEZONE: "America/Los_Angeles"
            N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
            N8N_RUNNERS_ENABLED: "true"
            DB_TYPE: postgresdb
            DB_POSTGRESDB_DATABASE: n8n
            DB_POSTGRESDB_HOST: n8n-postgres
            DB_POSTGRESDB_PORT: "5432"
            DB_POSTGRESDB_USER: n8n
            DB_POSTGRESDB_SCHEMA: public
            DB_POSTGRESDB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_PASSWORD
            N8N_HOST: n8n.mdeleon.dev
            WEBHOOK_URL: https://n8n.mdeleon.dev/
    postgres:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        postgres:
          nameOverride: postgres
          image:
            repository: postgres
            tag: "16.15"
          env:
            PGDATA: "/var/lib/postgresql/data/pg_data"
            POSTGRES_DB: "n8n"
            POSTGRES_USER: n8n
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_PASSWORD

  service:
    n8n:
      controller: n8n
      ports:
        http:
          port: 5678
    postgres:
      controller: postgres
      ports:
        http:
          port: 5432

  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: n8n
        gethomepage.dev/description: Workflow Automation
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Automation
        gethomepage.dev/icon: sh-n8n.png
        gethomepage.dev/pod-selector: ""
      hosts:
        - host: &host n8n.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: n8n
                port: http
      tls:
        - secretName: n8n-tls-cert
          hosts:
            - *host

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        n8n:
          n8n:
            - path: /home/node/.n8n
    pg-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        postgres:
          postgres:
            - path: /var/lib/postgresql/data
