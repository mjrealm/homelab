---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
spec:
  instances: 1
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: immich
      owner: app
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-r2
        serverName: immich-database

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

    # This extension is loaded via the Database CRD below
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-database
spec:
  name: immich
  owner: app
  cluster:
    name: immich-database
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-r2
spec:
  retentionPolicy: {{ .Values.backup.r2.retention | quote }}
  configuration:
    destinationPath: s3://{{ .Values.backup.r2.bucket }}/immich
    endpointURL: {{ .Values.backup.r2.endpointURL | quote }}
    s3Credentials:
      accessKeyId:
        name: immich-secrets
        key: R2_ACCESS_KEY_ID
      secretAccessKey:
        name: immich-secrets
        key: R2_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  # R2 has no regions, and rejects the newer default S3 checksums.
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: auto
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-daily
spec:
  schedule: {{ .Values.backup.r2.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: immich-database
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
