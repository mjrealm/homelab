---
app-template:
  controllers:
    album-creator:
      containers:
        main:
          image:
            repository: salvoxia/immich-folder-album-creator
            tag: 1.0.0
    immich-mcp:
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: ghcr.io/barryw/immichmcp
            tag: v3.3.5
          env:
            TZ: America/Los_Angeles
            MCP_PORT: "5000"
            IMMICH_TOOL_MODE: gateway
            IMMICH_BASE_URL: http://immich-server.immich.svc:2283

  service:
    immich-mcp:
      controller: immich-mcp
      ports:
        http:
          port: 5000

  persistence:
    external-photos:
      enabled: true
      type: nfs
      server: 192.168.1.200
      path: /volume1/media/photos/
      advancedMounts:
        album-creator:
          main:
            - path: /external-photos

immich:
  # app-template 5.3.0 and the immich chart share the bjw-s common library, which
  # needs this key; without it the immich templates fail with a nil pointer.
  namespace:
    create: false
  # defaultPodOptions:
  #   nodeSelector:
  #     plex.tv/host: "true" # For intel sync
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.3.4
  immich:
    metrics:
      enabled: true

  server:
    controllers:
      main:
        replicas: 1

  valkey:
    enabled: true
    persistence:
      data:
        enabled: true
        size: 1Gi
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce

  machine-learning:
    enabled: true
    controllers:
      main:
        replicas: 1
    persistence:
      cache:
        enabled: true
        size: 10Gi
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce

  persistence:
    external-photos:
      enabled: true
      type: nfs
      server: 192.168.1.200
      path: /volume1/media/photos/
