apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: docuseal-mc
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: fefa3b53-6b57-4b79-a20a-e7a9db8c00bf
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-apps
        namespace: infisical-operator
      secretsScope:
        projectSlug: apps
        envSlug: prod
        secretsPath: /docuseal-mc
        recursive: false
  managedKubeSecretReferences:
    - secretName: docuseal-mc-secrets
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          DATABASE_URL: "postgresql://postgres:{{ `{{ .POSTGRES_PASSWORD.Value }}` }}@docuseal-mc-postgres:5432/docuseal"
