---
app-template:
  controllers:
    tautulli:
      strategy: Recreate
      containers:
        tautulli:
          image:
            repository: ghcr.io/tautulli/tautulli
            tag: v2.18.2
          env:
            TZ: America/Los_Angeles
            PUID: "1000"
            PGID: "1000"

  service:
    tautulli:
      controller: tautulli
      ports:
        http:
          port: 8181

  ingress:
    tautulli:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Tautulli
        gethomepage.dev/description: Plex monitoring and tracking
        gethomepage.dev/group: Media Tools
        gethomepage.dev/icon: sh-tautulli.png
      hosts:
        - host: &tautulli tautulli.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: tautulli
                port: http
      tls:
        - secretName: tautulli-tls-cert
          hosts:
            - *tautulli

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
