---
app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

  controllers:
    maintainerr:
      strategy: Recreate
      containers:
        maintainerr:
          image:
            repository: ghcr.io/maintainerr/maintainerr
            tag: 3.32.0
          env:
            TZ: America/Los_Angeles

  service:
    maintainerr:
      controller: maintainerr
      ports:
        http:
          port: 6246

  ingress:
    maintainerr:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Maintainerr
        gethomepage.dev/description: Library maintenance for Plex
        gethomepage.dev/group: Media Tools
        gethomepage.dev/icon: sh-maintainerr.png
      hosts:
        - host: &maintainerr maintainerr.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: maintainerr
                port: http
      tls:
        - secretName: maintainerr-tls-cert
          hosts:
            - *maintainerr

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /opt/data
