---
app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1000
  controllers:
    main:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        main:
          nameOverride: sure
          image:
            repository: ghcr.io/we-promise/sure
            tag: 0.7.6-hotfix.2
          env: &env
            TZ: America/Los_Angeles
            SELF_HOSTED: "true"
            RAILS_FORCE_SSL: "false"
            RAILS_ASSUME_SSL: "true"
            DB_HOST: sure-database-rw
            DB_PORT: "5432"
            POSTGRES_DB: sure
            POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: sure-database-app
                  key: username
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: sure-database-app
                  key: password
            REDIS_URL: redis://sure-redis:6379/1
            OIDC_ISSUER: https://pocket.mdeleon.dev
            OIDC_REDIRECT_URI: https://sure.mdeleon.dev/auth/openid_connect/callback
          envFrom: &env-from
            - secretRef:
                name: sure-secrets
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /up
                  port: 3000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /up
                  port: 3000
    worker:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      pod:
        # The storage PVC is ReadWriteOnce, so the worker must share a node with main.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: sure
                    app.kubernetes.io/controller: main
      containers:
        main:
          nameOverride: sure-worker
          image:
            repository: ghcr.io/we-promise/sure
            tag: 0.7.6-hotfix.2
          command:
            - bundle
            - exec
            - sidekiq
          env: *env
          envFrom: *env-from
    redis:
      strategy: Recreate
      containers:
        main:
          nameOverride: redis
          image:
            repository: redis
            tag: 7.4.12
  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
    redis:
      controller: redis
      ports:
        redis:
          port: 6379
  ingress:
    main:
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Sure
        gethomepage.dev/description: Personal Finance
        gethomepage.dev/group: Knowledge
        gethomepage.dev/weight: "5"
        gethomepage.dev/icon: sh-sure-finance.png
      hosts:
        - host: &sure sure.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: sure-tls-cert
          hosts:
            - *sure
  persistence:
    storage:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /rails/storage
        worker:
          main:
            - path: /rails/storage
