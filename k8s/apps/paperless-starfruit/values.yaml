---
app-template:
  controllers:
    main:
      # SQLite on one ReadWriteOnce volume, so a single replica with Recreate.
      replicas: 1
      strategy: Recreate
      containers:
        main:
          nameOverride: paperless-starfruit
          image:
            repository: ghcr.io/sabbaken/paperless-starfruit/api
            tag: 1.6.0
          env:
            PORT: "3000"
            DATABASE_PATH: /data/app.db
            CORS_ORIGIN: https://starfruit.mdeleon.dev
          resources:
            requests:
              memory: 256Mi
            limits:
              # Node sizes its heap from the container limit, so keep one set.
              memory: 2Gi

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000

  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: Starfruit
        gethomepage.dev/description: Paperless AI Metadata and OCR
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Documents
        gethomepage.dev/icon: sh-paperless-starfruit.png
        gethomepage.dev/weight: "3"
      hosts:
        - host: &starfruit starfruit.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: starfruit-tls-cert
          hosts:
            - *starfruit

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /data
