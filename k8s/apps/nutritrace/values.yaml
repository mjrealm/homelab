---
app-template:
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          nameOverride: nutritrace
          image:
            repository: ghcr.io/traceapps/nutritrace
            # Only :latest and :dev are published, so pin the build by digest.
            tag: latest@sha256:2a7ddec27518660cfb71d5599b75a7bba65c41837f43d10519dfd1fd13b6dcbc
          env:
            DB_PATH: /data/db/nutritrace.db
            UPLOADS_PATH: /data/uploads
            UPDATE_CHECK: "off"
            TZ: America/Los_Angeles
            OIDC_DISPLAY_NAME: Pocket ID
            OIDC_SCOPE: openid profile email

  service:
    main:
      controller: main
      ports:
        http:
          port: 3001

  ingress:
    nutritrace:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: NutriTrace
        gethomepage.dev/description: Nutrition Tracker
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Fitness
        gethomepage.dev/icon: https://raw.githubusercontent.com/traceapps/nutritrace/main/public/icons/icon-192.png
      hosts:
        - host: &nutritrace nutritrace.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: nutritrace-tls-cert
          hosts:
            - *nutritrace

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /data/db
              subPath: db
            - path: /data/uploads
              subPath: uploads
