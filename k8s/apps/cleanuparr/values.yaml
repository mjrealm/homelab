---
app-template:
  controllers:
    cleanuparr:
      strategy: Recreate
      containers:
        cleanuparr:
          image:
            repository: ghcr.io/cleanuparr/cleanuparr
            tag: 2.11.1
          env:
            TZ: America/Los_Angeles
            PORT: "11011"
            PUID: "1000"
            PGID: "1000"

  service:
    cleanuparr:
      controller: cleanuparr
      ports:
        http:
          port: 11011

  ingress:
    cleanuparr:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Cleanuparr
        gethomepage.dev/description: Download Manager for Servarr
        gethomepage.dev/group: Media Tools
        gethomepage.dev/icon: sh-cleanuparr.png
      hosts:
        - host: &cleanuparr cleanuparr.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: cleanuparr
                port: http
      tls:
        - secretName: cleanuparr-tls-cert
          hosts:
            - *cleanuparr

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
