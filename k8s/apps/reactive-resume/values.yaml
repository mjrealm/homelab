---
app-template:
  controllers:
    main:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          nameOverride: reactive-resume
          image:
            repository: amruthpillai/reactive-resume
            tag: v6.1.1
          env:
            APP_URL: "https://rxresume.mdeleon.dev"
            NODE_ENV: "production"
            PORT: "3000"
            LOCAL_STORAGE_PATH: "/app/data"
            FLAG_DISABLE_EMAIL_AUTH: "true"
            FLAG_DISABLE_SIGNUPS: "false"
            FLAG_ALLOW_UNSAFE_AI_BASE_URL: "true"
            OAUTH_PROVIDER_NAME: "Pocket ID"
            OAUTH_DISCOVERY_URL: "https://pocket.mdeleon.dev/.well-known/openid-configuration"
            OAUTH_SCOPES: "openid profile email"
            AUTH_SECRET:
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: AUTH_SECRET
            ENCRYPTION_SECRET:
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: ENCRYPTION_SECRET
            DATABASE_URL:
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: DATABASE_URL
            OAUTH_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: OAUTH_CLIENT_ID
            OAUTH_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: OAUTH_CLIENT_SECRET
    postgres:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        postgres:
          nameOverride: postgres
          image:
            repository: postgres
            tag: "18"
          env:
            POSTGRES_DB: "postgres"
            POSTGRES_USER: "postgres"
            PGDATA: "/var/lib/postgresql/data/pg_data"
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: POSTGRES_PASSWORD

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
    postgres:
      controller: postgres
      ports:
        tcp:
          port: 5432

  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Reactive Resume
        gethomepage.dev/description: Resume builder
        gethomepage.dev/group: Documents
        gethomepage.dev/icon: reactive-resume.png
        gethomepage.dev/pod-selector: "app.kubernetes.io/name=reactive-resume"
        gethomepage.dev/weight: "11"
      hosts:
        - host: &rxresume rxresume.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: rxresume-tls-cert
          hosts:
            - *rxresume

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    postgres:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        postgres:
          postgres:
            - path: /var/lib/postgresql/data
