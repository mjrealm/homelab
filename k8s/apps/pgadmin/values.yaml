---
app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 5050
      runAsGroup: 5050
      fsGroup: 5050

  controllers:
    main:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        main:
          nameOverride: pgadmin
          image:
            repository: dpage/pgadmin4
            tag: 9.19
          env:
            PGADMIN_DISABLE_POSTFIX: "true"
          envFrom:
            - secretRef:
                name: pgadmin-secrets
  service:
    main:
      controller: main
      ports:
        http:
          port: 80

  ingress:
    pgadmin:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: pgAdmin
        gethomepage.dev/description: PostgreSQL Administration
        gethomepage.dev/group: Database Tools
        gethomepage.dev/icon: pgadmin.png
        gethomepage.dev/pod-selector: ""
      hosts:
        - host: &pgadmin pgadmin.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: pgadmin-tls-cert
          hosts:
            - *pgadmin

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      globalMounts:
        - path: /var/lib/pgadmin
    backups:
      enabled: true
      type: nfs
      server: 192.168.1.200
      path: /volume1/backups/
      advancedMounts:
        main:
          main:
            - path: /backups
