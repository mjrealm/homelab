---
app-template:
  defaultPodOptions:
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - karakeep
            topologyKey: "kubernetes.io/hostname"
  controllers:
    karakeep:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        karakeep:
          nameOverride: karakeep
          image:
            repository: ghcr.io/karakeep-app/karakeep
            tag: 0.34.1
          env:
            KARAKEEP_VERSION: release
            OPENAI_BASE_URL: "http://litellm.litellm.svc:4000/v1"
            INFERENCE_TEXT_MODEL: "qwen3.8:fast"
            INFERENCE_IMAGE_MODEL: "qwen3.8:fast"
            MEILI_ADDR: "http://karakeep-meilisearch:7700"
            NEXTAUTH_URL: https://karakeep.mdeleon.dev
            DATA_DIR: /data
            BROWSER_WEB_URL: "http://karakeep-chrome:9222"
            DISABLE_PASSWORD_AUTH: false
            DISABLE_SIGNUPS: true
            OAUTH_WELLKNOWN_URL: https://pocket.mdeleon.dev/.well-known/openid-configuration
            OAUTH_PROVIDER_NAME: Pocket-ID
          envFrom:
            - secretRef:
                name: karakeep-secrets
    meilisearch:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        meilisearch:
          image:
            repository: getmeili/meilisearch
            tag: v1.58.0
          env:
            MEILI_NO_ANALYTICS: "true"
            MEILI_MASTER_KEY:
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: MEILI_MASTER_KEY
    chrome:
      strategy: Recreate
      containers:
        meilisearch:
          image:
            repository: zenika/alpine-chrome
            tag: 124
          args:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --hide-scrollbars

  service:
    karakeep:
      controller: karakeep
      ports:
        http:
          port: 3000
    meilisearch:
      controller: meilisearch
      ports:
        http:
          port: 7700
    chrome:
      controller: chrome
      ports:
        http:
          port: 9222

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      globalMounts:
        - path: /data
    meili-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      globalMounts:
        - path: /meili_data

  ingress:
    karakeep:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: Karakeep
        gethomepage.dev/description: Bookmark Everything
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: Knowledge
        gethomepage.dev/icon: sh-karakeep-light.png
        gethomepage.dev/weight: '3'
        gethomepage.dev/widget.type: karakeep
        gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_KARAKEEP_KEY}}" }}'
        gethomepage.dev/widget.url: http://karakeep.karakeep.svc:3000
      hosts:
        - host: karakeep.mdeleon.dev
          paths:
            - path: "/"
              pathType: Prefix
              service:
                identifier: karakeep
                port: http
      tls:
        - secretName: karakeep-tls-cert
          hosts:
            - karakeep.mdeleon.dev
