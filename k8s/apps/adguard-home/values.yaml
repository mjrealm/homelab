---
app-template:
  controllers:
    main:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/controller
                      operator: In
                      values:
                        - main
                        - secondary
                topologyKey: "kubernetes.io/hostname"
      # strategy: RollingUpdate
      # rollingUpdate:
      #   unavailable: 0
      #   surge: 1
      strategy: Recreate
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      containers:
        main:
          nameOverride: adguard-primary
          image:
            repository: adguard/adguardhome
            tag: v1.0.0
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
    secondary:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/controller
                      operator: In
                      values:
                        - main
                        - secondary
                topologyKey: "kubernetes.io/hostname"
      # strategy: RollingUpdate
      # rollingUpdate:
      #   unavailable: 0
      #   surge: 1
      strategy: Recreate
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      containers:
        main:
          nameOverride: adguard-secondary
          image:
            repository: adguard/adguardhome
            tag: v1.0.0
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
    mcp:
      strategy: RollingUpdate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        main:
          nameOverride: adguard-mcp
          image:
            repository: ghcr.io/samik081/mcp-adguard-home
            tag: 0.11.0
          env:
            MCP_TRANSPORT: http
            MCP_PORT: "3000"
            # The HTTP transport has no auth; accept only in-cluster hostnames.
            MCP_ALLOWED_HOSTS: adguard-home-mcp,adguard-home-mcp.adguard-home,adguard-home-mcp.adguard-home.svc,adguard-home-mcp.adguard-home.svc.cluster.local
            ADGUARD_URL: http://adguard-home-main.adguard-home.svc
            ADGUARD_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: adguard-home-secrets
                  key: ADGUARD_USERNAME
            ADGUARD_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: adguard-home-secrets
                  key: ADGUARD_PASSWORD
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
    mcp-secondary:
      strategy: RollingUpdate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        main:
          nameOverride: adguard-mcp-secondary
          image:
            repository: ghcr.io/samik081/mcp-adguard-home
            tag: 0.11.0
          env:
            MCP_TRANSPORT: http
            ADGUARD_ACCESS_TIER: read-only
            MCP_PORT: "3000"
            # The HTTP transport has no auth; accept only in-cluster hostnames.
            MCP_ALLOWED_HOSTS: adguard-home-mcp-secondary,adguard-home-mcp-secondary.adguard-home,adguard-home-mcp-secondary.adguard-home.svc,adguard-home-mcp-secondary.adguard-home.svc.cluster.local
            ADGUARD_URL: http://adguard-home-secondary.adguard-home.svc
            ADGUARD_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: adguard-home-secrets
                  key: ADGUARD_USERNAME
            ADGUARD_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: adguard-home-secrets
                  key: ADGUARD_PASSWORD
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
    sync:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        main:
          nameOverride: adguard-sync
          image:
            repository: ghcr.io/bakito/adguardhome-sync
            tag: v0.10.1
          args: [run]
          env:
            CRON: "*/10 * * * *"
            RUN_ON_START: "true"
            API_PORT: "8080"
            ORIGIN_URL: http://adguard-home-main.adguard-home.svc
            REPLICA1_URL: http://adguard-home-secondary.adguard-home.svc
            ORIGIN_USERNAME: &user
              valueFrom:
                secretKeyRef:
                  name: adguard-home-secrets
                  key: ADGUARD_USERNAME
            ORIGIN_PASSWORD: &pass
              valueFrom:
                secretKeyRef:
                  name: adguard-home-secrets
                  key: ADGUARD_PASSWORD
            REPLICA1_USERNAME: *user
            REPLICA1_PASSWORD: *pass
  service:
    mcp-secondary:
      controller: mcp-secondary
      ports:
        http:
          port: 3000
    mcp:
      controller: mcp
      ports:
        http:
          port: 3000
    main:
      type: LoadBalancer
      loadBalancerIP: 192.168.10.201
      controller: main
      ports:
        http:
          protocol: HTTP
          port: 80
        http-web:
          protocol: HTTP
          port: 3000
        dns-tcp:
          protocol: TCP
          port: 53
        dns-udp:
          protocol: UDP
          port: 53
    secondary:
      type: LoadBalancer
      loadBalancerIP: 192.168.10.202
      controller: secondary
      ports:
        http:
          protocol: HTTP
          port: 80
        http-web:
          protocol: HTTP
          port: 3000
        dns-tcp:
          protocol: TCP
          port: 53
        dns-udp:
          protocol: UDP
          port: 53

  persistence:
    work-primary:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        main:
          main:
            - path: /opt/adguardhome/work
    work-secondary:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        secondary:
          main:
            - path: /opt/adguardhome/work
    config-primary:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 100Mi
      advancedMounts:
        main:
          main:
            - path: /opt/adguardhome/conf
    config-secondary:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 100Mi
      advancedMounts:
        secondary:
          main:
            - path: /opt/adguardhome/conf

  ingress:
    primary:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: Adguard Home (Primary)
        gethomepage.dev/description: Ad blocker and DNS server
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: DNS Servers
        gethomepage.dev/icon: adguard-home.png
        gethomepage.dev/pod-selector: ''
        gethomepage.dev/weight: '1'
        gethomepage.dev/widget.type: adguard
        gethomepage.dev/widget.url: http://adguard-home-main.adguard-home.svc
        gethomepage.dev/widget.username: '{{ "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}" }}'
        gethomepage.dev/widget.password: '{{ "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}" }}'
      hosts:
        - host: guard1.mdeleon.dev
          paths:
            - path: "/"
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: adguard-primary-tls-cert
          hosts:
            - guard1.mdeleon.dev
    secondary:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: Adguard Home (Secondary)
        gethomepage.dev/description: Ad blocker and DNS server
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: DNS Servers
        gethomepage.dev/icon: adguard-home.png
        gethomepage.dev/pod-selector: ''
        gethomepage.dev/weight: '2'
        gethomepage.dev/widget.type: adguard
        gethomepage.dev/widget.url: http://adguard-home-secondary.adguard-home.svc
        gethomepage.dev/widget.username: '{{ "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}" }}'
        gethomepage.dev/widget.password: '{{ "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}" }}'
      hosts:
        - host: guard2.mdeleon.dev
          paths:
            - path: "/"
              pathType: Prefix
              service:
                identifier: secondary
                port: http
      tls:
        - secretName: adguard-secondary-tls-cert
          hosts:
            - guard2.mdeleon.dev
