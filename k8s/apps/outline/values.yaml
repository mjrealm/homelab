---
app-template:
  controllers:
    main:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      pod:
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
      containers:
        main:
          nameOverride: outline
          image:
            repository: outlinewiki/outline
            tag: 1.13.0
          env:
            URL: https://wiki.mdeleon.dev
            FILE_STORAGE: local
            FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
            FILE_STORAGE_UPLOAD_MAX_SIZE: "26214400"
            NODE_ENV: production
            PORT: "3000"
            REDIS_URL: "redis://outline-redis:6379"
            PGSSLMODE: "disable"
            FORCE_HTTPS: "false"
            OIDC_AUTH_URI: https://pocket.mdeleon.dev/authorize
            OIDC_TOKEN_URI: https://pocket.mdeleon.dev/api/oidc/token
            OIDC_USERINFO_URI: https://pocket.mdeleon.dev/api/oidc/userinfo
            OIDC_LOGOUT_URI: https://pocket.mdeleon.dev/api/oidc/end-session
            OIDC_DISABLE_REDIRECT: "False"
            OIDC_DISPLAY_NAME: Pocket ID
            OIDC_USERNAME_CLAIM: preferred_username
            OIDC_SCOPES: openid profile email groups
          envFrom:
            - secretRef:
                name: outline-secrets
    postgres:
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        main:
          nameOverride: postgres
          image:
            repository: postgres
            tag: "16.15"
          env:
            PGDATA: "/var/lib/postgresql/data/pg_data"
            POSTGRES_DB: "outline"
            POSTGRES_USER: admin
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: POSTGRES_PASSWORD
    redis:
      strategy: Recreate
      containers:
        main:
          nameOverride: redis
          image:
            repository: redis
            tag: 7.4.12
  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
    postgres:
      controller: postgres
      ports:
        http:
          port: 5432
    redis:
      controller: redis
      ports:
        http:
          port: 6379

  ingress:
    outline:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.middlewares: outline-force-secure@kubernetescrd
        gethomepage.dev/description: Modern Wiki
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Knowledge
        gethomepage.dev/weight: "4"
        gethomepage.dev/icon: outline.png
        gethomepage.dev/name: Outline
        gethomepage.dev/pod-selector: ""
      hosts:
        - host: &outline wiki.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: outline-tls-cert
          hosts:
            - *outline

  persistence:
    storage:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /var/lib/outline/data
    pg-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        postgres:
          main:
            - path: /var/lib/postgresql/data
