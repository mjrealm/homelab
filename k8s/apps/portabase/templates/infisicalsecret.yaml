apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: portabase
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: fefa3b53-6b57-4b79-a20a-e7a9db8c00bf
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-apps
        namespace: infisical-operator
      secretsScope:
        projectSlug: apps
        envSlug: prod
        secretsPath: /portabase
        recursive: false
  managedKubeSecretReferences:
    - secretName: portabase-secrets
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          DATABASE_URL: "postgresql://portabase:{{ `{{ .POSTGRES_PASSWORD.Value | urlquery }}` }}@portabase-postgres:5432/portabase?schema=public"
