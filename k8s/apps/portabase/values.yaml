---
app-template:
  controllers:
    portabase:
      replicas: 1
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        portabase:
          image:
            repository: portabase/portabase
            tag: 1.35.2
          env:
            TZ: America/Los_Angeles
            PROJECT_URL: https://portabase.mdeleon.dev
            POSTGRES_HOST: portabase-postgres
            POSTGRES_PORT: "5432"
            POSTGRES_USER: portabase
            POSTGRES_DB: portabase
            AUTH_OIDC_POCKET_ID: pocket
            AUTH_OIDC_POCKET_TITLE: Pocket ID
            AUTH_OIDC_POCKET_DESC: ""
            AUTH_OIDC_POCKET_ICON: https://github.com/user-attachments/assets/4ceb2708-9f29-4694-b797-be833efce17d
            AUTH_OIDC_POCKET_ISSUER_URL: https://pocket.mdeleon.dev
            AUTH_OIDC_POCKET_HOST: pocket.mdeleon.dev
            AUTH_OIDC_POCKET_SCOPES: openid profile email groups
            AUTH_OIDC_POCKET_PKCE: "true"
            AUTH_OIDC_POCKET_ROLE_MAP: admin:admin,default:user
            AUTH_OIDC_POCKET_ALLOW_UNLINKING: "false"
            AUTH_OIDC_POCKET_DISCOVERY_ENDPOINT: https://pocket.mdeleon.dev/.well-known/openid-configuration
            AUTH_OIDC_POCKET_JWKS_ENDPOINT: https://pocket.mdeleon.dev/.well-known/jwks.json
          envFrom:
            - secretRef:
                name: portabase-secrets
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
    postgres:
      type: statefulset
      replicas: 1
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        postgres:
          image:
            repository: postgres
            tag: "17"
          env:
            PGDATA: /var/lib/postgresql/data/pgdata
            POSTGRES_USER: portabase
            POSTGRES_DB: portabase
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: portabase-secrets
                  key: POSTGRES_PASSWORD
  service:
    portabase:
      controller: portabase
      ports:
        http:
          port: 80
    postgres:
      controller: postgres
      ports:
        postgresql:
          port: 5432
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Portabase"
        gethomepage.dev/description: "Database Auto-Backup"
        gethomepage.dev/group: "Database Tools"
        gethomepage.dev/icon: "sh-portabase.png"
      hosts:
        - host: &host portabase.mdeleon.dev
          paths:
            - path: /
              service:
                identifier: portabase
                port: http
      tls:
        - secretName: portabase-tls-cert
          hosts:
            - *host
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        portabase:
          portabase:
            - path: /data
    postgres-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        postgres:
          postgres:
            - path: /var/lib/postgresql/data
