---
app-template:
  controllers:
    main:
      # The API keeps its data in JSON files on one ReadWriteOnce volume, so a
      # second pod would be a second writer.
      replicas: 1
      strategy: Recreate
      containers:
        api:
          image:
            repository: ghcr.io/duartesantos8/opengym-api
            tag: 1.4.2  # keep in step with the web image
          env:
            PORT: "3000"
            DATA_DIR: /data
            RP_NAME: openGym
            RP_ID: opengym.mdeleon.dev
            ORIGIN: https://opengym.mdeleon.dev
            # Register your own profile right after the first deploy, then set
            # INVITE_ONLY to "1": with no profile and no admin yet, nobody could
            # create the first invite code.
            FIRST_USER_ADMIN: "1"
            ALLOW_GUEST: "0"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
        web:
          image:
            repository: ghcr.io/duartesantos8/opengym-web
            tag: 1.4.2  # same version as the api container
          env:
            # The image runs as uid 101, which can't bind ports below 1024 here.
            NGINX_PORT: "8080"
            # Both containers share the pod network, so the API is on localhost.
            BACKEND: 127.0.0.1
            PORT: "3000"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
                initialDelaySeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi

  service:
    main:
      controller: main
      ports:
        http:
          port: 8080

  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: openGym
        gethomepage.dev/description: Gym and Body-Weight Tracker
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Fitness
        gethomepage.dev/icon: sh-opengym.png
      hosts:
        - host: &opengym opengym.mdeleon.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: opengym-tls-cert
          hosts:
            - *opengym

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi  # users, passkeys, session secret and uploads: back this up
      advancedMounts:
        main:
          api:
            - path: /data
