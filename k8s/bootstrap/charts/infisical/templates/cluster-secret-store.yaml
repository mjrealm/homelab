---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
  {{- if .Values.fakeSecretStore.enabled }}
    # Local test cluster only: serve the three keys from values instead of AWS.
    fake:
      data:
        {{- range $name, $value := .Values.fakeSecretStore.data }}
        - key: {{ $.Values.aws.ssmPath }}/{{ $name }}
          value: {{ $value | quote }}
        {{- end }}
  {{- else }}
    aws:
      service: ParameterStore
      region: {{ .Values.aws.region }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials # created by the aws-secrets Ansible role
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
  {{- end }}
