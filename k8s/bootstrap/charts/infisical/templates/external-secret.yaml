---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: infisical-secrets
    template:
      data:
        ENCRYPTION_KEY: '{{`{{ .encryptionKey }}`}}'
        AUTH_SECRET: '{{`{{ .authSecret }}`}}'
        REDIS_PASSWORD: '{{`{{ .redisPassword }}`}}'
        REDIS_URL: 'redis://:{{`{{ .redisPassword }}`}}@infisical-redis:6379'
        SITE_URL: {{ .Values.siteUrl | quote }}
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: {{ .Values.aws.ssmPath }}/ENCRYPTION_KEY
    - secretKey: authSecret
      remoteRef:
        key: {{ .Values.aws.ssmPath }}/AUTH_SECRET
    - secretKey: redisPassword
      remoteRef:
        key: {{ .Values.aws.ssmPath }}/REDIS_PASSWORD
