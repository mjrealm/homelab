---
argo-cd:
  global:
    domain: &host argo.mdeleon.dev

  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    ingress:
      enabled: true
      hostname: *host
      tls: false
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Argo CD
        gethomepage.dev/description: Declarative GitOps CD for Kubernetes
        gethomepage.dev/group: System
        gethomepage.dev/icon: sh-argo-cd.png
      extraTls:
        - hosts:
            - *host
          secretName: argocd-tls-cert

  notifications:
    enabled: false
  dex:
    enabled: false
    metrics:
      enabled: false
      serviceMonitor:
        enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  configs:
    params:
      server.insecure: true
    rbac:
      policy.csv: |
        g, mdeleon, role:admin
    cm:
      # mdeleon is API-key only here: it owns the token the MCP server uses.
      accounts.mdeleon: login, apiKey
      accounts.admin: login, apiKey
      oidc.config: |
        name: Pocket ID
        issuer: https://pocket.mdeleon.dev
        clientID: $argocd-secrets:OIDC_CLIENT_ID
        clientSecret: $argocd-secrets:OIDC_CLIENT_SECRET
        logoutURL: https://pocket.mdeleon.dev/api/oidc/end-session
        requestedScopes: ["openid", "profile", "email", "groups"]
        requestedIDTokenClaims: {"groups": {"essential": true}}

app-template:
  controllers:
    mcp-server:
      suffix: mcp-server
      strategy: Recreate
      annotations:
        secrets.infisical.com/auto-reload: "true"
      containers:
        mcp-server:
          nameOverride: argo-mcp-server
          env:
            ARGOCD_BASE_URL: http://argocd-server.argocd.svc:80
            MCP_BIND_ADDRESS: 0.0.0.0
            ARGOCD_API_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: argocd-secrets
                  key: ARGOCD_API_TOKEN
            MCP_AUTH_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: argocd-secrets
                  key: MCP_AUTH_TOKEN
          image:
            repository: ghcr.io/argoproj-labs/mcp-for-argocd
            tag: "0.9.0"

  service:
    mcp-server:
      suffix: mcp-server
      controller: mcp-server
      ports:
        http:
          port: 3000