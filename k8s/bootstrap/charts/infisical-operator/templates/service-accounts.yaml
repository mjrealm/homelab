{{- range .Values.stacks }}
---
# Identity the operator uses to authenticate to Infisical for the {{ . }} stack.
# Each InfisicalSecret references it with autoCreateServiceAccountToken. Infisical
# validates the short-lived token with the TokenReview API, which needs
# system:auth-delegator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-{{ . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-{{ . }}-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: infisical-{{ . }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
