---
# Installs the CNPG operator from its GitOps location. The platform ApplicationSet
# keeps managing the same chart afterwards. The install is skipped when the
# operator already exists, as on a live cluster where Argo CD runs it.
- name: Look for an existing CloudNativePG operator
  kubernetes.core.k8s_info:
    kind: Deployment
    name: cnpg-cloudnative-pg
    namespace: cnpg
  register: cnpg_operator
  tags: cnpg

- name: Add CloudNativePG chart repo
  when: not ansible_check_mode
  kubernetes.core.helm_repository:
    name: cnpg
    repo_url: https://cloudnative-pg.github.io/charts
  tags: cnpg

- name: Install CloudNativePG using Helm
  when: not ansible_check_mode and cnpg_operator.resources | length == 0
  kubernetes.core.helm:
    name: cnpg
    chart_ref: ../platform/cnpg/
    release_namespace: cnpg
    create_namespace: true
    dependency_update: true
    values_files:
      - ../platform/cnpg/values.yaml
    wait: true
  tags: cnpg

- name: Wait for CloudNativePG CRDs
  kubernetes.core.k8s_info:
    kind: CustomResourceDefinition
    name: "{{ item }}"
  loop:
    - clusters.postgresql.cnpg.io
    - scheduledbackups.postgresql.cnpg.io
  register: crd
  until: crd.resources | length > 0
  retries: 10
  delay: 20
  tags: cnpg
