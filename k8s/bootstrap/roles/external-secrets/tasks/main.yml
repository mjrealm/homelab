---
- name: Check that the AWS credentials are set
  ansible.builtin.assert:
    that:
      - infisical_aws_access_key_id | length > 0
      - infisical_aws_secret_access_key | length > 0
    fail_msg: >-
      The AWS access key ID and secret access key are required (the
      homelab-infisical-bootstrap IAM key from Bitwarden).
  tags: external-secrets

- name: Add External Secrets chart repo
  when: not ansible_check_mode
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: https://charts.external-secrets.io
  tags: external-secrets

- name: Install External Secrets using Helm
  when: not ansible_check_mode
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: charts/external-secrets/
    release_namespace: external-secrets
    create_namespace: true
    dependency_update: true
    values_files:
      - charts/external-secrets/values.yaml
    wait: true
  tags: external-secrets

- name: Wait for External Secrets CRDs
  kubernetes.core.k8s_info:
    kind: CustomResourceDefinition
    name: "{{ item }}"
  loop:
    - clustersecretstores.external-secrets.io
    - externalsecrets.external-secrets.io
  register: crd
  until: crd.resources | length > 0
  retries: 10
  delay: 20
  tags: external-secrets

- name: Create the AWS credentials Secret for External Secrets
  when: not ansible_check_mode
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: aws-credentials
        namespace: external-secrets
      type: Opaque
      stringData:
        access-key-id: "{{ infisical_aws_access_key_id }}"
        secret-access-key: "{{ infisical_aws_secret_access_key }}"
  tags: external-secrets
