apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: headlamp
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: b80ad456-f091-4fdc-9477-518d2b3852e8
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-system
        namespace: infisical-operator
      secretsScope:
        projectSlug: system
        envSlug: prod
        secretsPath: /headlamp
        recursive: false
  managedKubeSecretReferences:
    - secretName: headlamp-secrets
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Owner
