---
victoria-logs-single:
  server:
    retentionPeriod: "1w"
    enabled: true
    persistentVolume:
      enabled: true
      extraLabels:
        velero.io/exclude-from-backup: "true"
    serviceMonitor:
      enabled: true
    ingress:
      enabled: true
      pathType: Prefix
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/name: VictoriaLogs
        gethomepage.dev/description: Logs Manager
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Observability
        gethomepage.dev/icon: sh-victoriametrics.png
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/href: "https://vlogs.mdeleon.dev/select/vmui"
      hosts:
        - name: &host vlogs.mdeleon.dev
          path:
            - /
          port: http
      tls:
        - secretName: vlogs-tls-cert
          hosts:
            - *host
  vector:
    # -- Enable deployment of vector
    enabled: true

  dashboards:
    # -- Create VictoriaLogs dashboards
    enabled: false
    grafanaOperator:
      enabled: true

victoria-logs-mcp:
  vl:
    entrypoint: http://logs-victoria-logs-single-server.logs.svc:9428
  mcp:
    # Server operation mode: http / sse
    mode: http
    passthroughHeaders: []
  ingress:
    enabled: false
