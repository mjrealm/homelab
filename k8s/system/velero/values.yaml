---
velero:
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.4
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins
  annotations:
    secrets.infisical.com/auto-reload: "true"
  credentials:
    useSecret: true
    existingSecret: velero-secrets
  configuration:
    backupStorageLocation:
      - name: r2
        default: true
        provider: aws
        bucket: homelab-backups
        config:
          region: auto
          s3ForcePathStyle: true
          s3Url: https://683d43af18913fe58dc1c66b52e4a027.r2.cloudflarestorage.com
        credential:
          name: velero-secrets
          key: r2
      - name: aws
        provider: aws
        bucket: mdeleon-416964654612-us-east-2-an
        config:
          region: us-east-2
        credential:
          name: velero-secrets
          key: aws
    features: EnableCSI
    extraEnvVars:
      - name: TZ
        value: America/Los_Angeles

  snapshotsEnabled: false

  schedules:
    daily-backup:
      schedule: "1 3 * * *"
      template:
        storageLocation: r2
        ttl: "168h"  # 7 days
        snapshotVolumes: true
        includedNamespaces:
          - paperless-ngx
          - immich
          - mealie
          - hermes
          - hindsight
          - outline
    biweekly-backup:
      schedule: "0 4 * * 0,3"
      template:
        storageLocation: r2
        ttl: "336h"  # 14 days
        snapshotVolumes: true
        includedNamespaces:
          - '*'
    monthly-backup:
      schedule: "30 3 1 * *"
      template:
        storageLocation: r2
        ttl: "8760h"  # 365 days
        snapshotVolumes: true
        includedNamespaces:
          - '*'
    monthly-backup-aws:
      schedule: "30 4 1 * *"
      template:
        storageLocation: aws
        ttl: "8760h"  # 365 days
        snapshotVolumes: true
        includedNamespaces:
          - '*'

  extraObjects:
    - apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: longhorn-velero
        labels:
          velero.io/csi-volumesnapshot-class: "true"
      driver: driver.longhorn.io
      deletionPolicy: Retain
