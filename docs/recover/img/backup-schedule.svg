<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 458" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Backup schedule over 24 hours</title><desc id="d">Database base backups run between 01:00 and 05:00 UTC. Velero, which takes the Longhorn CSI snapshots, runs between about 10:00 and 13:00 UTC. The two never overlap.</desc>
