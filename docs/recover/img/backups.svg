<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Homelab backups</title><desc id="d">What is backed up, which tool does it, and where the copies live, including the NAS 3-2-1 copies.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="680" rx="14" fill="#f8fafc"/>
<text x="30" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">What is backed up, and where it lives</text>
<text x="30" y="82" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.6">IN THE CLUSTER</text>
<text x="290" y="82" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.6">BACKUP TOOL</text>
<text x="560" y="82" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.6">WHERE THE COPY LIVES</text>
<text x="890" y="82" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.6">NAS 3-2-1</text>
<rect x="30" y="105" width="225" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
<rect x="30" y="105" width="6" height="92" rx="3" fill="#16a34a"/>
<text x="48" y="131" font-size="15" font-weight="600" fill="#0f172a">App volumes</text>
<text x="48" y="150" font-size="12.5" font-weight="400" fill="#475569">every Longhorn volume</text>
<rect x="290" y="105" width="235" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
<rect x="290" y="105" width="6" height="92" rx="3" fill="#16a34a"/>
<text x="308" y="131" font-size="15" font-weight="600" fill="#0f172a">Longhorn backup</text>
<text x="308" y="150" font-size="12.5" font-weight="400" fill="#475569">made by Velero snapshots</text>
<rect x="560" y="105" width="270" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
<rect x="560" y="105" width="6" height="92" rx="3" fill="#16a34a"/>
<text x="578" y="131" font-size="15" font-weight="600" fill="#0f172a">NAS (volume data)</text>
<text x="578" y="150" font-size="12.5" font-weight="400" fill="#475569">NFS: /volume1/backups/k3s/longhorn</text>
<text x="578" y="167" font-size="12.5" font-weight="400" fill="#475569">one copy per snapshot</text>
<rect x="30" y="235" width="225" height="92" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
<rect x="30" y="235" width="6" height="92" rx="3" fill="#ea580c"/>
<text x="48" y="261" font-size="15" font-weight="600" fill="#0f172a">Kubernetes objects</text>
<text x="48" y="280" font-size="12.5" font-weight="400" fill="#475569">deployments, PVCs, ...</text>
<rect x="290" y="235" width="235" height="92" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
<rect x="290" y="235" width="6" height="92" rx="3" fill="#ea580c"/>
<text x="308" y="261" font-size="15" font-weight="600" fill="#0f172a">Velero</text>
<text x="308" y="280" font-size="12.5" font-weight="400" fill="#475569">scheduled backups</text>
<rect x="560" y="235" width="270" height="92" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
<rect x="560" y="235" width="6" height="92" rx="3" fill="#ea580c"/>
<text x="578" y="261" font-size="15" font-weight="600" fill="#0f172a">Cloudflare R2</text>
<text x="578" y="280" font-size="12.5" font-weight="400" fill="#475569">bucket homelab-backups</text>
<text x="578" y="297" font-size="12.5" font-weight="400" fill="#475569">Velero 7d, 14d, 1y. App DBs 3d or 14d</text>
<rect x="30" y="365" width="225" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="30" y="365" width="6" height="92" rx="3" fill="#2563eb"/>
<text x="48" y="391" font-size="15" font-weight="600" fill="#0f172a">Databases with a backup</text>
<text x="48" y="410" font-size="12.5" font-weight="400" fill="#475569">own backup, point in time</text>
<rect x="290" y="365" width="235" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="290" y="365" width="6" height="92" rx="3" fill="#2563eb"/>
<text x="308" y="391" font-size="15" font-weight="600" fill="#0f172a">Barman (CNPG)</text>
<text x="308" y="410" font-size="12.5" font-weight="400" fill="#475569">weekly/daily base + WAL</text>
<rect x="560" y="365" width="270" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="560" y="365" width="6" height="92" rx="3" fill="#2563eb"/>
<text x="578" y="391" font-size="15" font-weight="600" fill="#0f172a">AWS S3</text>
<text x="578" y="410" font-size="12.5" font-weight="400" fill="#475569">Infisical database, kept 14 days</text>
<text x="578" y="427" font-size="12.5" font-weight="400" fill="#475569">Velero monthly copy, kept 1 year</text>
<rect x="30" y="495" width="225" height="92" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<rect x="30" y="495" width="6" height="92" rx="3" fill="#64748b"/>
<text x="48" y="521" font-size="15" font-weight="600" fill="#0f172a">Cluster config</text>
<text x="48" y="540" font-size="12.5" font-weight="400" fill="#475569">this repository</text>
<rect x="290" y="495" width="235" height="92" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<rect x="290" y="495" width="6" height="92" rx="3" fill="#64748b"/>
<text x="308" y="521" font-size="15" font-weight="600" fill="#0f172a">Git push</text>
<text x="308" y="540" font-size="12.5" font-weight="400" fill="#475569">every merge</text>
<rect x="560" y="495" width="270" height="92" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<rect x="560" y="495" width="6" height="92" rx="3" fill="#64748b"/>
<text x="578" y="521" font-size="15" font-weight="600" fill="#0f172a">GitHub</text>
<text x="578" y="540" font-size="12.5" font-weight="400" fill="#475569">mjrealm/homelab</text>
<text x="578" y="557" font-size="12.5" font-weight="400" fill="#475569">also cloned on your Mac</text>
<line x1="255" y1="151" x2="290" y2="151" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="525" y1="151" x2="560" y2="151" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="255" y1="281" x2="290" y2="281" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="525" y1="281" x2="560" y2="281" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="255" y1="411" x2="290" y2="411" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="525" y1="411" x2="560" y2="411" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="255" y1="541" x2="290" y2="541" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="525" y1="541" x2="560" y2="541" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="485" y1="327" x2="630" y2="365" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="645" y="354" font-size="11.5" font-weight="400" fill="#2563eb" text-anchor="start">monthly copy</text>
<line x1="600" y1="235" x2="600" y2="197" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="612" y="217" font-size="11.5" font-weight="400" fill="#16a34a" text-anchor="start">snapshots point at the NAS data</text>
<rect x="890" y="95" width="280" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<rect x="890" y="95" width="6" height="70" rx="3" fill="#16a34a"/>
<text x="908" y="121" font-size="15" font-weight="600" fill="#0f172a">USB disk</text>
<text x="908" y="140" font-size="12.5" font-weight="400" fill="#475569">copy 2: a different medium</text>
<rect x="890" y="177" width="280" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<rect x="890" y="177" width="6" height="70" rx="3" fill="#16a34a"/>
<text x="908" y="203" font-size="15" font-weight="600" fill="#0f172a">Offsite NAS</text>
<text x="908" y="222" font-size="12.5" font-weight="400" fill="#475569">copy 3: at a family member's home</text>
<line x1="830" y1="133" x2="890" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<line x1="830" y1="167" x2="890" y2="212" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="890" y="270" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Daily, kept 30 days or more.</text>
<text x="890" y="288" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Synology USB Copy / Hyper Backup.</text>
<rect x="890" y="330" width="280" height="215" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="906" y="358" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Not separately backed up</text>
<text x="906" y="384" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Databases without a Barman backup:</text>
<text x="906" y="402" font-size="12" font-weight="400" fill="#475569" text-anchor="start">only the volume is snapshotted, with</text>
<text x="906" y="420" font-size="12" font-weight="400" fill="#475569" text-anchor="start">no point-in-time restore.</text>
<text x="906" y="450" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Argo CD state: rebuilt from Git.</text>
<text x="906" y="468" font-size="12" font-weight="400" fill="#475569" text-anchor="start"></text>
<text x="906" y="486" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Secrets: they live in Infisical, so the</text>
<text x="906" y="504" font-size="12" font-weight="400" fill="#475569" text-anchor="start">database backup above covers them.</text>
<text x="30" y="662" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Green = volume data on the NAS. Orange = Kubernetes objects in R2. Blue = AWS. Grey = Git.</text>
</svg>