---
# Extra variables for `make test-bootstrap`: a disposable k3d cluster instead of
# the real one. Not for production. Test keys come from .test/keys.yml.
bootstrap_profile: test
confirm: "yes"

# SeaweedFS (test/cluster.sh) stands in for the AWS S3 bucket. These are its throwaway credentials.
infisical_aws_access_key_id: testaccesskey
infisical_aws_secret_access_key: testsecretkey
aws_region_input: us-east-1

test_base_values:
  database:
    size: 1Gi
  backup:
    bucket: infisical-backups
    endpointURL: http://homelab-test-s3:8333
  # Serve the Infisical keys from values instead of AWS SSM.
  fakeSecretStore:
    enabled: true
    data: "{{ test_infisical_keys }}"

# Set by test/recovery.yml: restore the database from the S3 backup into a new cluster.
test_recovery_values:
  recovery:
    enabled: true
    sourceServerName: infisical-database
  backup:
    serverName: infisical-database-r1

infisical_extra_values: "{{ test_base_values | combine(test_recovery_values if (test_recovery | default(false)) else {}, recursive=True) }}"
